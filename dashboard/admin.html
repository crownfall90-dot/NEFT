// Технический анализ монеты — сводка по всем её таймфреймам и стратегиям
// разом, по кнопке, а не только когда сканер сам выбрал эту пару в топ.
// Данные уже приходят с каждым тиком (book.scan.hits — все стратегии,
// не только лидер), здесь просто собираем их по текущей паре и даём вердикт.
function tfSort(a,b){
  const ord={"1m":0,"5m":1,"15m":2,"1h":3,"4h":4,"1d":5};
  return (ord[a]??9)-(ord[b]??9);
}
function rankVerdict(k){ return k==="go"?2:k==="near"?1:0; }
function waitFromWhy(strategy, why){
  const w=String(why||"").toLowerCase();
  const s=String(strategy||"");
  if(/HSS/i.test(s)){
    if(w.includes("doji")) return "doji есть — ждёт вход по правилу";
    if(w.includes("откат вниз")) return "откат к EMA сверху — ждёт doji на продажу";
    if(w.includes("откат вверх")) return "откат к EMA снизу — ждёт doji на покупку";
    if(w.includes("ниже ema")) return "ниже EMA — ждёт откат и объёмную doji";
    if(w.includes("выше ema")) return "выше EMA — ждёт откат и doji";
    return "ждёт doji у EMA";
  }
  if(/Squeeze/i.test(s)){
    if(w.includes("у границы")) return "у границы треугольника — ждёт пробой";
    if(w.includes("сжимается")) return "сжимается — ждёт касание границы";
    return "ждёт сжатие и пробой";
  }
  if(/Flow/i.test(s)){
    if(w.includes("orb")&&w.includes("за")) return "за ORB — ждёт подтверждение Flow";
    if(w.includes("vwap")) return "у VWAP — место входа Flow";
    return "ждёт цену у VWAP / ORB";
  }
  if(/London/i.test(s)){
    if(w.includes("у свинга")) return "у свинга — ждёт слом на зоне";
    if(w.includes("вне ny")) return "вне окна NY — ждёт сессию";
    return "ждёт касание зоны London";
  }
  if(/Breakout|Пробой/i.test(s)){
    if(w.includes("за диапазоном")||w.includes("за боксом")) return "за боксом — ждёт вход";
    return "ждёт пробой бокса 16–18 UTC";
  }
  return why||"набирает условия";
}
function nearFibNote(px, fibLines){
  if(px==null||!fibLines||!fibLines.length) return "";
  let hit=null;
  for(const l of fibLines){
    const p=+l.price;
    if(!Number.isFinite(p)) continue;
    const d=Math.abs(p-px)/Math.max(Math.abs(px),1e-12);
    if(d<0.0015&&(!hit||d<hit.d)) hit={d, title:String(l.title||"Fib")};
  }
  if(!hit) return "";
  const lbl=hit.title.replace(/^Fib\s*/i,"Fib ");
  return lbl+" рядом с ценой — зона интереса";
}
function buildVerdictLine(books, best, taBest, minScore){
  const px=liveBars.length?+liveBars[liveBars.length-1].close:null;
  const viewBook=books.find(bookSameTf)||books[0];
  const fibSrc=getFibLines(viewBook);
  const fibNote=nearFibNote(px, fibSrc.length?fibSrc:fibFromBars(liveBars));
  const leadBook=(best&&best.tf)?books.find(b=>b.tf===best.tf)||viewBook:viewBook;
  const setup=leadBook&&(leadBook.setup||leadBook.position||leadBook.pending);
  const bits=[];
  if(best&&best.kind==="go"){
    bits.push(setup&&setup.kind==="position"?"В сделке":"Вход выставлен");
    bits.push(best.strategy+" · "+best.tf);
    if(setup&&(setup.entry||setup.price)) bits.push("вход "+n(setup.entry||setup.price));
    if(fibNote) bits.push(fibNote);
    return bits.join(" · ");
  }
  if(best&&best.kind==="near"){
    bits.push(best.strategy+" "+best.tf+" — "+waitFromWhy(best.strategy, best.why));
    if(best.why){
      const ctx=String(best.why).split(",").map(s=>s.trim()).filter(Boolean).slice(0,2).join(", ");
      if(ctx) bits.push("сейчас: "+ctx);
    }
    if(taBest&&taBest.hints&&taBest.hints[0]) bits.push(taBest.hints[0]);
    if(fibNote) bits.push(fibNote);
    return bits.join("; ");
  }
  if(taBest&&(taBest.score||0)>=0.5){
    bits.push("Порог "+minScore+" не набран");
    if(taBest.trend) bits.push(taBest.trend);
    if(taBest.structure_txt&&taBest.structure_txt!=="боковик") bits.push("структура "+taBest.structure_txt);
    if(taBest.hints&&taBest.hints.length) bits.push(taBest.hints.slice(0,2).join(", "));
    if(fibNote) bits.push(fibNote);
    return bits.join(" · ");
  }
  bits.push("Рано — ни одна стратегия не набрала порог "+minScore);
  if(fibNote) bits.push(fibNote);
  return bits.join(" · ");
}
function analysisReport(){
  const pair=normPair(window.__neftPair||pref.pair||"");
  const books=((lastBlot&&lastBlot.books)||[]).filter(b=>normPair(b.pair)===pair);
  const coin=pair.replace("USDT","");
  if(!books.length){
    const px=liveBars.length?+liveBars[liveBars.length-1].close:null;
    const fibNote=nearFibNote(px, fibFromBars(liveBars));
    let verdictText=coin+" — ждём снимок бота по этой паре (1–2 сек)";
    if(fibNote) verdictText+=" · "+fibNote;
    return {pair, coin, tfs:[], verdictText, verdictKind:"wait"};
  }
  const minScore=+($("scan_min")&&$("scan_min").value)||1.2;
  books.sort((a,b)=>tfSort(a.tf,b.tf));
  let best=null;
  const tfs=books.map(b=>{
    const setup=b.setup||b.position||b.pending;
    const setupStrat=String((setup&&setup.strategy)||"");
    const hits=[...((b.scan&&b.scan.hits)||[])].sort((x,y)=>(y.score||0)-(x.score||0));
    const rows=hits.map(h=>{
      const strat=h.strategy||"";
      let kind="wait", label="рано";
      if(setup && setupStrat.includes(strat)){
        kind="go"; label=setup.kind==="position"?"в сделке":"вход выставлен";
      } else if((h.score||0)>=minScore){
        kind="near"; label="сканер видит";
      }
      const rk=rankVerdict(kind);
      const brk=best?rankVerdict(best.kind):-1;
      if(!best || rk>brk || (rk===brk&&(h.score||0)>(best.score||0))){
        best={kind, tf:b.tf, strategy:strat, why:h.why||"", label, score:h.score||0};
      }
      return {strat, score:h.score||0, why:h.why||"", kind, label};
    });
    return {tf:b.tf, rows};
  });
  let taBest=null;
  for(const b of books){
    const ta=b.scan&&b.scan.ta;
    if(ta && (ta.score||0)>(taBest&&taBest.score||0)) taBest={...ta, tf:b.tf};
  }
  for(const b of books){
    const s=b.setup||b.position||b.pending;
    if(s&&(s.kind==="position"||s.kind==="pending")){
      best={
        kind:"go", tf:b.tf, strategy:s.strategy||"?", why:"",
        label:s.kind==="position"?"в сделке":"вход выставлен", score:999,
      };
      break;
    }
  }
  let verdictKind="wait";
  if(best&&best.kind==="go") verdictKind="go";
  else if(best&&best.kind==="near") verdictKind="near";
  else if(taBest&&(taBest.score||0)>=0.5) verdictKind="near";
  const verdictText=buildVerdictLine(books, best, taBest, minScore);
  return {pair, coin:pair.replace("USDT",""), tfs, verdictText, verdictKind, best, taBest};
}

  if(ph) ph.textContent=r.coin||r.pair.replace("USDT","");
  const ab=$("analysisBody");

function taBlockFromBooks(books){
  let best=null;
  for(const b of books||[]){
    const ta=b.scan&&b.scan.ta;
    if(!ta) continue;
    if(!best || (ta.score||0)>(best.score||0)) best={...ta, tf:b.tf};
  }
  if(!best) return "";
  const hints=best.hints||[];
  const meta=[best.trend, best.structure_txt, best.rsi!=null?"RSI "+best.rsi:null].filter(Boolean).join(" · ");
  if(!hints.length && !meta) return "";
  const chips=hints.map(h=>`<span class="chip">${tagEsc(h)}</span>`).join("");
  return `<div class="an-ta"><h5>контекст рынка${best.tf?" · "+tagEsc(best.tf):""}</h5>`
    +(meta?`<p class="an-ta-meta">${tagEsc(meta)}</p>`:"")
    +(chips?`<div class="chips">${chips}</div>`:"")
    +`</div>`;
}
function analysisHtml(){
  const r=analysisReport();
  const books=((lastBlot&&lastBlot.books)||[]).filter(b=>normPair(b.pair)===normPair(r.pair||""));
  if(!r.tfs.length){
    return `<div class="an-verdict wait">${tagEsc(r.verdictText)}</div>`;
  }
  let html=`<div class="an-verdict ${r.verdictKind}">${tagEsc(r.verdictText)}</div>`;
  html+=taBlockFromBooks(books);
  html+=r.tfs.map(t=>{
    if(!t.rows.length) return `<div class="an-tf"><div class="an-tf-h">${tagEsc(t.tf)}</div><div class="an-empty">стратегии ещё готовят данные</div></div>`;
    const rows=t.rows.map(row=>
      `<div class="an-row"><span class="nm">${tagEsc(row.strat)}</span>`
      +`<span class="badge ${row.kind}">${row.kind==="go"?"вход":row.kind==="near"?"рядом":"рано"}</span>`
      +`<span class="why">${tagEsc(row.why||"—")} · score ${row.score.toFixed(1)}</span></div>`
    ).join("");
    return `<div class="an-tf"><div class="an-tf-h">${tagEsc(t.tf)}</div>${rows}</div>`;
  }).join("");
  return html;
}

function ensureAnalysisPop(){
  const p=$("analysisPop");
  if(!p) return null;
  if(p.parentElement!==document.body) document.body.appendChild(p);
  return p;
}
function pinAnalysisPop(pop){
  const key="neftAnalysisPos";
  try{
    const saved=JSON.parse(localStorage.getItem(key)||"null");
    if(saved&&Number.isFinite(saved.x)&&Number.isFinite(saved.y)){
      pop.style.left=Math.max(8,saved.x)+"px";
      pop.style.top=Math.max(8,saved.y)+"px";
      pop.style.right="auto";
      pop.style.bottom="auto";
      return;
    }
  }catch(e){}
  const w=pop.offsetWidth||420;
  pop.style.left=Math.max(8, window.innerWidth-w-16)+"px";
  pop.style.top="72px";
  pop.style.right="auto";
  pop.style.bottom="auto";
}
function initAnalysisDrag(){
  const pop=ensureAnalysisPop();
  const head=pop&&pop.querySelector(".cset-h");
  if(!pop||!head) return;
  const key="neftAnalysisPos";
  pinAnalysisPop(pop);
  let drag=null, moved=false, dragEndAt=0;
  head.addEventListener("pointerdown",ev=>{
    if(ev.button!==0) return;
    if(ev.target.closest("button")) return;
    ev.preventDefault();
    ev.stopPropagation();
    const r=pop.getBoundingClientRect();
    pop.style.left=r.left+"px";
    pop.style.top=r.top+"px";
    pop.style.right="auto";
    pop.style.bottom="auto";
    try{ head.setPointerCapture(ev.pointerId); }catch(e){}
    drag={id:ev.pointerId, ox:ev.clientX-r.left, oy:ev.clientY-r.top};
    moved=false;
    head.classList.add("dragging");
  });
  head.addEventListener("pointermove",ev=>{
    if(!drag||drag.id!==ev.pointerId) return;
    ev.preventDefault();
    moved=true;
    const w=pop.offsetWidth||420, h=pop.offsetHeight||320;
    const x=Math.max(8, Math.min(window.innerWidth-w-8, ev.clientX-drag.ox));
    const y=Math.max(8, Math.min(window.innerHeight-h-8, ev.clientY-drag.oy));
    pop.style.left=x+"px";
    pop.style.top=y+"px";
  });
  function endDrag(ev){
    if(!drag||ev.pointerId!==drag.id) return;
    try{ head.releasePointerCapture(ev.pointerId); }catch(e){}
    head.classList.remove("dragging");
    if(moved){
      dragEndAt=Date.now();
      try{
        localStorage.setItem(key, JSON.stringify({
          x:parseInt(pop.style.left,10)||0,
          y:parseInt(pop.style.top,10)||0,
        }));
      }catch(e){}
    }
    drag=null;
    ev.preventDefault();
    ev.stopPropagation();
  }
  head.addEventListener("pointerup", endDrag);
  head.addEventListener("pointercancel", endDrag);
  window.__analysisDragGuard=()=>Date.now()-dragEndAt<500;
}
initAnalysisDrag();
function chartOpts(){
  pref.emaN=+$("optEma").value||100; pref.grid=$("optGrid").checked;
  savePref(); applyChartOpts();
  if(pref.ema&&ema) ema.setData(emaCalc(liveBars,pref.emaN));
}
async function reloadChart(){
  savePref(); applyChartOpts();
  const pair=window.__neftPair||(bookNow&&bookNow.pair);
  if(!pair) return;
  await showMarket(pair, pref.tf, (bookNow&&bookNow.venue)||venueOf(pair));
  if(lastBlot&&lastBlot.books){
    bookNow=chartBook(bookNow, lastBlot.books);
    applyOverlay(bookNow);
  }
}

async function showMarket(pair, tf, venue){
  const coin=pair.replace("USDT","");
  const fake={ key:pair+"|"+tf, label:coin+" "+tf, pair, venue, tf,
    candles:[], lines:[], markers:[], setup:null, trades:0, pnl:0,
    status:"рынок", strategies:[] };
  bookNow=fake; lastKey=""; lastOverlay=""; lastLevelsSig=""; lastOverlayHadTrade=false;
  // Чистим следы прошлой пары СРАЗУ. Иначе до следующего опроса (2 с) на
  // графике висят её линии и серии, а автомасштаб считает их своими.
  try{
    const ser=candle||window.__neftCandle;
    if(ser){
      priceLines.forEach(l=>{ try{ ser.removePriceLine(l);}catch(e){} });
      if(ser.setMarkers) ser.setMarkers([]);
    }
    priceLines=[]; tagLines=[]; tradeMarkData=[]; liveBars=[];
    applyScanPaths(null);
    applyBands(null, []);
    paintLineTags();
    paintTradeMarks();
  }catch(e){}
  window.__neftPair=pair;
  window.__neftTf=tf;
  pref.pair=pair;
  savePref();
  lastAnalysisSig="";
  refreshAnalysisPanel(true);
  syncTickerHead();
  if(typeof window.__neftKeepPair==="function") window.__neftKeepPair(pair, tf);
  syncTickerHead();
  document.querySelectorAll("#list .sym").forEach(el=>el.classList.toggle("on", el.dataset.p===pair));
  await loadMarket(fake);
  connectLive(fake);
  homeView();
  resizeChart();
  obFailN=0;
  pollOrderbook();
  if(lastBlot&&lastBlot.books){
    const view=lastBlot.books.find(bookFits)||lastBlot.books.find(bookSamePair)||null;
    if(view){
      bookNow=chartBook(view, lastBlot.books);
      applyOverlay(bookNow);
    }
  }
}
function defaultList(){
  const raw=(S.crypto_symbols&&S.crypto_symbols.length)?S.crypto_symbols
    :(UNI.length?UNI:["ETH/USDT:USDT","BNB/USDT:USDT","XRP/USDT:USDT","BCH/USDT:USDT","HYPE/USDT:USDT","SOL/USDT:USDT","DOGE/USDT:USDT","ZEC/USDT:USDT","SUI/USDT:USDT"]);
  const coins=[...raw].filter(s=>!String(s).startsWith("BTC")&&!String(s).startsWith("ENA"));
  renderList(coins.map(s=>{
    const c=String(s).split("/")[0];
    const pair=c+"USDT";
    return {pair, venue:venueOf(pair), label:c, sub:"рынок", state:"рынок"};
  }));
}

async function chartTick(){
  try{
    const data=await (await fetch("/crypto_chart.json?t="+Date.now())).json();
    if(data && data.auth===false) return; // сессия протухла — jobs() перезагрузит страницу
    lastBlot=data;
    touchBlotTs(data);
    const panel=acctMode();
    if(panel!=="live") liveAcctOv=null;
    else if(data.mode==="live") liveAcctOv=null;
    else await fetchLiveAcct(false);
    const blot=blotForPanel(panel);
    paintHudRisk(blot?panel:"", blot?data.risk:null);
    paintAcctPanel();
    if(data.books&&data.books.length){
      await pick(data);
      const view=data.books.find(bookFits)||data.books.find(bookSamePair)||null;
      const b=chartBook(view, data.books);
      if(b){
        bookNow=b;
        applyOverlay(bookNow);
      }
    }
    renderBlot(data);
    applyLivePnl();
    refreshAnalysisPanel();
    const evs=data.events||[];
    if(evs.length){
      const sigs=evs.map(e=>JSON.stringify(e));
      const prevIdx=lastEvt?sigs.lastIndexOf(lastEvt):-1;
      // Если старое событие ещё в окне — берём всё после него. Если окно
      // уже прокрутилось дальше (событие вывалилось) — не заваливаем
      // тостами всю историю, берём только самое свежее.
      const fresh=prevIdx>=0?sigs.slice(prevIdx+1).map((_,i)=>evs[prevIdx+1+i]):evs.slice(-1);
      lastEvt=sigs[sigs.length-1];
      for(const e of fresh){
        if(e&&(e.type==="fill"||e.type==="close") && e.source!=="open"){
          tradeToastForEvent(e);
          if(e.type==="fill") blotTab("pos");
          else blotTab("deal");
        }
      }
    }
  }catch(e){}
}

})();
