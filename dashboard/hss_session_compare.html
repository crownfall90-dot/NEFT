<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSS M5 · сессии 11–19 vs 16–19</title>
<script src="/lightweight-charts.js?v=423"></script>
<style>
:root{
  --bg:#0b0d10; --panel:#14181f; --line:#243041; --text:#eef2f7; --muted:#8b97a8;
  --green:#3dd6c3; --red:#ff7b78; --ema:#c9a227; --blue:#5b9fd4;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
header{padding:18px 22px 10px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#121722 0%,var(--bg) 100%)}
header h1{margin:0;font:600 20px/1.2 var(--sans)}
header .sub{color:var(--muted);margin:6px 0 0;font-size:13px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--line)}
@media(max-width:900px){.compare{grid-template-columns:1fr}}
.sess{padding:16px 22px;background:var(--panel);border-right:1px solid var(--line)}
.sess:last-child{border-right:none}
.sess.win{outline:2px solid rgba(201,162,39,.45);background:rgba(201,162,39,.06)}
.sess h2{margin:0 0 10px;font:600 15px var(--sans);color:var(--ema)}
.sess .kpis{display:flex;flex-wrap:wrap;gap:16px}
.sess .kpis div span{display:block;color:var(--muted);font-size:11px}
.sess .kpis div b{font:600 17px/1.2 var(--mono)}
.pos{color:var(--green)}.neg{color:var(--red)}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 220px)}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 220px);background:#0e1218}
aside table{width:100%;border-collapse:collapse;font:12px/1.35 var(--mono)}
aside th,aside td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right}
aside th:first-child,aside td:first-child{text-align:left}
aside th{color:var(--muted);font:600 10px var(--sans);position:sticky;top:0;background:#151b24}
aside tr{cursor:pointer}
aside tr:hover{background:rgba(91,159,212,.08)}
aside tr.active{background:rgba(201,162,39,.14)}
main{display:flex;flex-direction:column;min-width:0}
.toolbar{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar strong{font-size:15px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;min-height:420px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:360px}
.pane:last-child{border-right:none}
.pane-h{padding:8px 12px;font:600 12px var(--sans);color:var(--muted);
  border-bottom:1px solid var(--line);background:#10151c}
.chart-box{flex:1;position:relative;min-height:320px;background:#080a0d}
.chart-el{position:absolute;inset:0}
.legend{font:11px var(--sans);color:var(--muted);padding:6px 12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>HSS M5 · plus_only · сравнение сессий</h1>
  <p class="sub" id="sub">загрузка…</p>
</header>
<section class="compare" id="sessCards"></section>
<div class="layout">
  <aside>
    <table>
      <thead><tr><th>символ</th><th>11–19</th><th>16–19</th><th>Δ</th></tr></thead>
      <tbody id="symBody"></tbody>
    </table>
  </aside>
  <main>
    <div class="toolbar">
      <strong id="symTitle">—</strong>
      <span style="color:var(--muted);font-size:12px">два графика M5 · Heikin Ashi · клик по сделке → зум</span>
    </div>
    <div class="charts">
      <div class="pane">
        <div class="pane-h">11–19 UTC+3</div>
        <div class="chart-box"><div class="chart-el" id="chartA"></div></div>
        <div class="legend" id="metaA">—</div>
      </div>
      <div class="pane">
        <div class="pane-h">16–19 UTC+3</div>
        <div class="chart-box"><div class="chart-el" id="chartB"></div></div>
        <div class="legend" id="metaB">—</div>
      </div>
    </div>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
function cls(v){ return v>0?"pos":(v<0?"neg":""); }
function money(v){ return (v>=0?"+$":"−$")+Math.abs(Number(v)).toFixed(2); }
function fmtPct(v){ return (v>=0?"+":"")+Number(v).toFixed(2)+"%"; }

let cmp=null, repA=null, repB=null, dataA=null, dataB=null;
let chartA=null, seriesA=null, emaA=null;
let chartB=null, seriesB=null, emaB=null;

function heikinAshi(bars){
  const out=[]; let po=null, pc=null;
  for(const c of bars){
    const hc=(+c.open + +c.high + +c.low + +c.close)/4;
    const ho=po==null?(+c.open + +c.close)/2:(po+pc)/2;
    const hh=Math.max(+c.high, ho, hc), hl=Math.min(+c.low, ho, hc);
    out.push({time:c.time, open:ho, high:hh, low:hl, close:hc});
    po=ho; pc=hc;
  }
  return out;
}
function emaCalc(bars, period){
  const out=[]; let e=null; const k=2/(period+1);
  for(const c of bars){
    const px=+c.close;
    e = e==null ? px : px*k + e*(1-k);
    out.push({time:c.time, value:e});
  }
  return out;
}
function mkChart(el){
  return LightweightCharts.createChart(el, {
    layout:{background:{color:"#080a0d"}, textColor:"#8b97a8"},
    grid:{vertLines:{color:"#1a2230"}, horzLines:{color:"#1a2230"}},
    timeScale:{borderColor:"#243041", timeVisible:true},
    rightPriceScale:{borderColor:"#243041"},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  });
}
function paintPane(chart, series, emaSeries, chartData){
  if(!chart || !series || !chartData) return;
  const raw = chartData.candles_m5 || chartData.candles_trade || [];
  const ha = heikinAshi(raw);
  series.setData(ha.map(c=>({
    time:c.time, open:c.open, high:c.high, low:c.low, close:c.close,
  })));
  if(emaSeries){
    emaSeries.setData(emaCalc(raw, 100));
  }
  const marks = (chartData.markers||[]).map(m=>({
    time:m.time, position:m.position||"belowBar",
    color:m.color||"#3dd6c3", shape:m.shape||"circle",
    text:m.label||m.kind||"",
  }));
  try{ series.setMarkers(marks.slice(0,80)); }catch(e){}
  chart.timeScale().fitContent();
}
async function loadReport(file){
  const r = await fetch("/dashboard/"+file+"?t="+Date.now(), {credentials:"same-origin"});
  if(!r.ok) throw new Error(file+" "+r.status);
  return r.json();
}
async function loadChart(path){
  const url = path.startsWith("dashboard/") ? "/"+path : "/dashboard/"+path.replace(/^\/+/,"");
  const r = await fetch(url+"?t="+Date.now(), {credentials:"same-origin"});
  if(!r.ok) throw new Error(path);
  return r.json();
}
function findBook(rep, sym){
  return (rep.books||[]).find(b=>b.symbol===sym);
}
async function showSym(sym){
  $("symTitle").textContent = sym;
  const bA = findBook(repA, sym), bB = findBook(repB, sym);
  try{
    dataA = bA && bA.chart ? await loadChart(bA.chart) : null;
    dataB = bB && bB.chart ? await loadChart(bB.chart) : null;
  }catch(e){
    $("metaA").textContent = $("metaB").textContent = "ошибка: "+e.message;
    return;
  }
  const mA = (dataA&&dataA.metrics)||{}, mB = (dataB&&dataB.metrics)||{};
  $("metaA").innerHTML = dataA
    ? `N ${mA.trades||0} · WR ${Number(mA.win_rate||0).toFixed(0)}% · ${money(mA.net_profit||0)} · PF ${Number(mA.profit_factor||0).toFixed(2)}`
    : "нет данных";
  $("metaB").innerHTML = dataB
    ? `N ${mB.trades||0} · WR ${Number(mB.win_rate||0).toFixed(0)}% · ${money(mB.net_profit||0)} · PF ${Number(mB.profit_factor||0).toFixed(2)}`
    : "нет данных";
  paintPane(chartA, seriesA, emaA, dataA);
  paintPane(chartB, seriesB, emaB, dataB);
}
function sessCard(exp, win){
  const s = exp.summary||{};
  const w = exp.id===win ? " win" : "";
  return `<div class="sess${w}">
    <h2>${exp.params.session} UTC+3${exp.id===win?" ★":""}</h2>
    <div class="kpis">
      <div><span>сделок</span><b>${s.trades||0}</b></div>
      <div><span>винрейт</span><b>${Number(s.win_rate||0).toFixed(1)}%</b></div>
      <div><span>лузеров</span><b>${s.losses||0}</b></div>
      <div><span>Σ PnL</span><b class="${cls(s.net_profit)}">${money(s.net_profit||0)}</b></div>
    </div>
  </div>`;
}
async function boot(){
  try{
    const r = await fetch("/dashboard/hss_session_compare.json?t="+Date.now(), {credentials:"same-origin"});
    if(!r.ok){ $("sub").textContent = "нет данных — python scripts/hss_session_compare.py"; return; }
    cmp = await r.json();
  }catch(e){ $("sub").textContent = "ошибка: "+e.message; return; }

  const exps = cmp.experiments||[];
  const win = cmp.winner_id;
  $("sub").textContent = `M5 · plus_only (${(cmp.symbols||[]).join(", ")}) · ${cmp.days}д · R:R 1:1.2 · vol min · ${cmp.ts||""}`;
  $("sessCards").innerHTML = exps.map(e=>sessCard(e, win)).join("");

  repA = await loadReport("hss_report_m5_sess1119.json");
  repB = await loadReport("hss_report_m5_sess1619.json");

  chartA = mkChart($("chartA"));
  seriesA = chartA.addCandlestickSeries({
    upColor:"#26a69a", downColor:"#ef5350",
    borderUpColor:"#26a69a", borderDownColor:"#ef5350",
    wickUpColor:"#26a69a", wickDownColor:"#ef5350",
  });
  emaA = chartA.addLineSeries({color:"#c9a227", lineWidth:1, priceLineVisible:false, lastValueVisible:false});
  chartB = mkChart($("chartB"));
  seriesB = chartB.addCandlestickSeries({
    upColor:"#26a69a", downColor:"#ef5350",
    borderUpColor:"#26a69a", borderDownColor:"#ef5350",
    wickUpColor:"#26a69a", wickDownColor:"#ef5350",
  });
  emaB = chartB.addLineSeries({color:"#c9a227", lineWidth:1, priceLineVisible:false, lastValueVisible:false});

  const syms = cmp.symbols || Object.keys(cmp.by_symbol||{});
  $("symBody").innerHTML = syms.map(sym=>{
    const row = (cmp.by_symbol||{})[sym]||{};
    const a = row.sess_1119||{}, b = row.sess_1619||{};
    const pa = a.net_profit||0, pb = b.net_profit||0;
    const d = pb - pa;
    return `<tr data-sym="${sym}">
      <td>${sym}</td>
      <td class="${cls(pa)}">${money(pa)}</td>
      <td class="${cls(pb)}">${money(pb)}</td>
      <td class="${cls(d)}">${money(d)}</td>
    </tr>`;
  }).join("");
  $("symBody").onclick = e=>{
    const tr = e.target.closest("tr[data-sym]");
    if(!tr) return;
    [...$("symBody").querySelectorAll("tr")].forEach(x=>x.classList.remove("active"));
    tr.classList.add("active");
    showSym(tr.dataset.sym);
  };
  const first = $("symBody").querySelector("tr");
  if(first){ first.classList.add("active"); showSym(first.dataset.sym); }

  window.addEventListener("resize", ()=>{
    ["chartA","chartB"].forEach((id,i)=>{
      const el = $(id), ch = i?chartB:chartA;
      if(ch && el) ch.applyOptions({width:el.clientWidth, height:el.clientHeight});
    });
  });
}
boot();
</script>
</body>
</html>
